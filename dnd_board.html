<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Крокодилы и Канализации | D&D Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Marcellus&display=swap" rel="stylesheet">
  <!-- Бесплатная библиотека WebRTC P2P-соединений -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --gold-border: #b18544;
      --gold-text: #f0c97d;
      --metal-bg: linear-gradient(180deg, #46372b 0%, #2b2018 50%, #17100b 100%);
      --metal-active: linear-gradient(180deg, #744d21 0%, #3e2610 100%);
      --parchment: #c8b594;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0907;
      color: #dfcdb7;
      font-family: 'Marcellus', serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ВЕРХНЯЯ КОВАНАЯ ПАНЕЛЬ */
    header {
      height: 52px;
      background: linear-gradient(180deg, #2b2118 0%, #18120d 70%, #0c0806 100%);
      border-bottom: 2px solid #5a422d;
      box-shadow: 0 4px 15px rgba(0,0,0,0.95);
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ЩИТ-ЛОГОТИП */
    .logo-shield {
      width: 36px;
      height: 44px;
      position: relative;
      background: radial-gradient(circle at 50% 35%, #5a2e16, #201108);
      clip-path: polygon(0% 0%, 100% 0%, 100% 70%, 50% 100%, 0% 70%);
      border: 2px solid #b8863f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(184, 134, 63, 0.4), inset 0 0 6px #000;
      filter: drop-shadow(0 2px 4px #000);
      flex-shrink: 0;
    }

    .shield-emblem {
      position: relative;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shield-emblem svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 1px 2px #000);
    }

    .logo-shield::before, .logo-shield::after {
      content: '';
      position: absolute;
      width: 3px;
      height: 3px;
      background: #e6b76a;
      border-radius: 50%;
      box-shadow: 0 0 2px #000;
    }
    .logo-shield::before { top: 3px; left: 4px; }
    .logo-shield::after { top: 3px; right: 4px; }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: var(--gold-text);
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(240, 201, 125, 0.4), 2px 2px 3px #000;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      background: var(--metal-bg);
      color: #e5d7c4;
      border: 1px solid #5d4633;
      padding: 4px 11px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.76rem;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 2px 4px rgba(0,0,0,0.7);
    }

    .btn:hover {
      border-color: #d1994e;
      color: #ffd88a;
      box-shadow: 0 0 8px rgba(220, 150, 40, 0.5);
    }

    .btn.active {
      background: var(--metal-active);
      border-color: #f1b75e;
      color: #ffe6a3;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8), 0 0 10px rgba(241, 183, 94, 0.5);
    }

    .btn-share {
      border-color: #8b6b23;
      background: linear-gradient(180deg, #574116 0%, #30220a 100%);
      color: #ffd782;
    }
    .btn-share:hover {
      border-color: #ffd700;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #5d4633;
      color: #a4d492;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .zoom-box {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(0,0,0,0.55);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #4a3625;
      font-size: 0.74rem;
      color: var(--gold-text);
      font-family: 'Cinzel', serif;
    }

    input[type="color"] {
      border: 1px solid #5d4633;
      background: none;
      width: 24px;
      height: 24px;
      border-radius: 3px;
      cursor: pointer;
      padding: 0;
    }

    .range-box {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      color: var(--gold-text);
    }

    /* СЦЕНА */
    .dungeon-scene {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      padding: 10px 14px 12px 14px;
      gap: 12px;
      background:
        radial-gradient(circle at 17% 20%, rgba(255, 140, 0, 0.35) 0%, rgba(255, 100, 0, 0.1) 22%, transparent 35%),
        radial-gradient(circle at 94% 22%, rgba(255, 140, 0, 0.35) 0%, rgba(255, 100, 0, 0.1) 22%, transparent 35%),
        radial-gradient(circle at 50% 50%, #2a221b 0%, #120e0b 60%, #080605 100%);
      background-size: cover;
    }

    /* БОКОВАЯ КОЛОНКА */
    .sidebar-scroll {
      width: 240px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #140f0c;
      border: 3px solid #473626;
      border-radius: 6px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 6px 20px rgba(0,0,0,0.8);
      position: relative;
      z-index: 10;
      transition: width 0.3s, opacity 0.3s;
    }

    /* Скрываем инвентарь для зрителя */
    body.spectator-mode .sidebar-scroll,
    body.spectator-mode .editor-only {
      display: none !important;
    }

    .scroll-head {
      padding: 7px;
      background: linear-gradient(180deg, #2b1f16, #140e0a);
      border-bottom: 2px solid #473626;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: var(--gold-text);
      letter-spacing: 1px;
    }

    .upload-btn-box {
      padding: 6px 8px;
      border-bottom: 1px solid #332419;
      background: #0e0a07;
    }

    .upload-label {
      display: block;
      border: 1px dashed #7a5837;
      padding: 5px;
      border-radius: 4px;
      cursor: pointer;
      background: rgba(43, 30, 19, 0.5);
      font-size: 0.74rem;
      text-align: center;
      color: #e5d7c4;
      transition: 0.2s;
    }

    .upload-label:hover {
      border-color: var(--gold-border);
      color: var(--gold-text);
    }

    #file-input, #save-file-input { display: none; }

    .inventory-parchment {
      flex: 1;
      margin: 8px;
      background: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 80%),
        linear-gradient(180deg, #c7b38d 0%, #b89f75 50%, #a28357 100%);
      border: 2px solid #5c432a;
      border-radius: 4px;
      box-shadow: inset 0 0 15px rgba(60, 40, 15, 0.65);
      overflow-y: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      align-content: start;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1;
      border: 2px solid #573e27;
      border-radius: 4px;
      overflow: hidden;
      cursor: grab;
      background: #0f0b08;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
      transition: transform 0.15s, border-color 0.15s;
    }

    .gallery-item:hover {
      border-color: #ffd88a;
      transform: scale(1.05);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .gallery-item .del-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(140, 0, 0, 0.85);
      color: white;
      border: none;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 9px;
      cursor: pointer;
      display: none;
    }

    .gallery-item:hover .del-btn { display: block; }

    .lizard-guard {
      position: absolute;
      bottom: 0;
      width: 280px;
      height: 85%;
      pointer-events: none;
      z-index: 5;
      background-repeat: no-repeat;
      background-position: bottom center;
      background-size: contain;
      filter: drop-shadow(0 0 15px rgba(0,0,0,0.85));
    }

    .lizard-left {
      left: 235px;
      background-image: radial-gradient(circle at 65% 25%, rgba(255, 140, 0, 0.3) 0%, transparent 40%);
    }

    .lizard-right {
      right: 0;
      background-image: radial-gradient(circle at 40% 25%, rgba(60, 255, 100, 0.3) 0%, transparent 40%);
    }

    /* ЦЕНТРАЛЬНЫЙ СТОЛ */
    .scroll-table-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 8;
      border: 3px solid #4a3625;
      border-radius: 6px;
      background: #110d0a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    .scroll-roll-top {
      height: 20px;
      background: linear-gradient(180deg, #3c2919 0%, #7d5e3c 45%, #d1b48b 55%, #6a4c2e 85%, #2a1b10 100%);
      border-bottom: 2px solid #23160c;
      box-shadow: 0 3px 8px rgba(0,0,0,0.7);
    }

    .canvas-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12), transparent 75%),
        linear-gradient(180deg, #d3c19f 0%, #c0ab86 50%, #ad946f 100%);
      box-shadow: inset 0 0 70px rgba(60, 40, 15, 0.6);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .instructions-card {
      position: absolute;
      bottom: 16px;
      right: 20px;
      background: linear-gradient(180deg, rgba(28, 20, 14, 0.95), rgba(14, 10, 7, 0.95));
      border: 2px solid #6b4d30;
      border-radius: 5px;
      padding: 7px 12px;
      font-size: 0.72rem;
      color: #dfcdb7;
      line-height: 1.4;
      box-shadow: 0 4px 15px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 20;
    }

    .instructions-card b {
      color: var(--gold-text);
    }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <header>
    <div class="title-box">
      <div class="logo-shield" title="Крокодилы и Канализации">
        <div class="shield-emblem">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 28,32 C 18,12 30,-2 40,2 C 34,10 32,22 36,36 Z" fill="url(#goldGradient)" />
            <path d="M 72,32 C 82,12 70,-2 60,2 C 66,10 68,22 64,36 Z" fill="url(#goldGradient)" />
            <path d="M 32,32 C 32,20 68,20 68,32 C 68,46 64,68 56,84 C 54,88 46,88 44,84 C 36,68 32,46 32,32 Z" fill="url(#goldGradient)" stroke="#4a3014" stroke-width="2"/>
            <circle cx="42" cy="46" r="6" fill="#301808" />
            <circle cx="58" cy="46" r="6" fill="#301808" />
            <circle cx="42" cy="46" r="4" fill="#ffd700" />
            <circle cx="58" cy="46" r="4" fill="#ffd700" />
            <circle cx="42" cy="46" r="2" fill="#000" />
            <circle cx="58" cy="46" r="2" fill="#000" />
            <polygon points="46,84 48,92 50,84" fill="#fff5d0" />
            <polygon points="50,84 52,92 54,84" fill="#fff5d0" />
            <defs>
              <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fae29c" />
                <stop offset="50%" stop-color="#c99738" />
                <stop offset="100%" stop-color="#694314" />
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>
      <h1>Крокодилы и Канализации</h1>
    </div>

    <div class="toolbar">
      <!-- Инструменты редактирования (только для хоста) -->
      <button class="btn active editor-only" id="tool-select" title="Горячая клавиша: V">✋ Перемещение</button>
      <button class="btn editor-only" id="tool-brush" title="Горячая клавиша: B">🖌️ Кисть</button>
      <button class="btn editor-only" id="tool-eraser" title="Горячая клавиша: E">🧹 Ластик</button>

      <div class="range-box editor-only">
        <label for="brush-color">Цвет:</label>
        <input type="color" id="brush-color" value="#8b1c1c">
      </div>

      <div class="range-box editor-only">
        <label for="brush-size">Размер:</label>
        <input type="range" id="brush-size" min="2" max="60" value="6">
      </div>

      <!-- Зум (доступен и зрителям, и хосту) -->
      <div class="zoom-box">
        <button class="btn" id="btn-zoom-out" style="padding:2px 6px;">-</button>
        <span id="zoom-level">100%</span>
        <button class="btn" id="btn-zoom-in" style="padding:2px 6px;">+</button>
        <button class="btn" id="btn-zoom-reset" style="padding:2px 6px;">1:1</button>
      </div>

      <button class="btn" id="btn-toggle-grid">🕸️ Сетка</button>
      <button class="btn editor-only" id="btn-clear-drawings" style="color: #ff9d9d;">Очистить рисунки</button>

      <button class="btn editor-only" id="btn-save-project" title="Сохранить в файл">💾 Сохранить</button>
      <button class="btn editor-only" id="btn-load-trigger" title="Загрузить из файла">📂 Загрузить</button>
      <input type="file" id="save-file-input" accept=".dnd,.json">

      <!-- Кнопка трансляции стола и статус -->
      <button class="btn btn-share" id="btn-share-link">🔗 Поделиться столом</button>
      <div class="status-badge" id="net-status" style="display: none;"></div>
    </div>
  </header>

  <!-- Сцена -->
  <main class="dungeon-scene">
    <aside class="sidebar-scroll">
      <div class="scroll-head">Изображения</div>
      <div class="upload-btn-box">
        <label class="upload-label" for="file-input">➕ Загрузить изображение</label>
        <input type="file" id="file-input" accept="image/*" multiple>
      </div>
      <div class="inventory-parchment" id="storage-gallery"></div>
    </aside>

    <div class="lizard-guard lizard-left"></div>
    <div class="lizard-guard lizard-right"></div>

    <section class="scroll-table-container">
      <div class="scroll-roll-top"></div>
      <div class="canvas-viewport" id="canvas-wrapper">
        <canvas id="viewport-canvas"></canvas>
      </div>
    </section>

    <div class="instructions-card">
      • <b>Зум:</b> Колёсико мыши<br>
      • <b>Панорама:</b> Колёсико или <b>Пробел + ЛКМ</b><br>
      <span id="role-hint">• <b>Изображения:</b> Перетаскивание инструментом «✋»</span>
    </div>
  </main>

  <script>
    const wrapper = document.getElementById('canvas-wrapper');
    const canvas = document.getElementById('viewport-canvas');
    const ctx = canvas.getContext('2d');

    const drawBuffer = document.createElement('canvas');
    const drawCtx = drawBuffer.getContext('2d');
    const WORLD_SIZE = 8000;
    drawBuffer.width = WORLD_SIZE;
    drawBuffer.height = WORLD_SIZE;

    const fileInput = document.getElementById('file-input');
    const saveFileInput = document.getElementById('save-file-input');
    const gallery = document.getElementById('storage-gallery');
    const btnSelect = document.getElementById('tool-select');
    const btnBrush = document.getElementById('tool-brush');
    const btnEraser = document.getElementById('tool-eraser');
    const colorPicker = document.getElementById('brush-color');
    const sizePicker = document.getElementById('brush-size');
    const btnGrid = document.getElementById('btn-toggle-grid');
    const btnClearDrawings = document.getElementById('btn-clear-drawings');
    const btnSaveProject = document.getElementById('btn-save-project');
    const btnLoadTrigger = document.getElementById('btn-load-trigger');
    const btnShareLink = document.getElementById('btn-share-link');
    const netStatus = document.getElementById('net-status');
    const roleHint = document.getElementById('role-hint');

    const zoomLevelDisplay = document.getElementById('zoom-level');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnZoomReset = document.getElementById('btn-zoom-reset');

    // Камера
    let camera = {
      x: WORLD_SIZE / 2 - 400,
      y: WORLD_SIZE / 2 - 300,
      zoom: 1.0,
      minZoom: 0.25,
      maxZoom: 4.5
    };

    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let isSpacePressed = false;

    // Режимы
    let currentTool = 'select';
    let isDrawing = false;
    let lastWorldPos = { x: 0, y: 0 };
    let showGrid = true;
    const GRID_SIZE = 60;

    let storageImages = [];
    let tokens = [];
    let selectedToken = null;
    let isDraggingToken = false;
    let isResizingToken = false;
    let tokenOffsetX = 0;
    let tokenOffsetY = 0;
    const RESIZE_HANDLE_RADIUS = 9;

    // СЕТЕВАЯ ЧАСТЬ (WEBRTC)
    let isHost = true;
    let peer = null;
    let connections = []; // Подключённые зрители (если хост)
    let hostConnection = null; // Соединение с хостом (если зритель)

    function screenToWorld(sx, sy) {
      return {
        x: camera.x + sx / camera.zoom,
        y: camera.y + sy / camera.zoom
      };
    }

    function resize() {
      const rect = wrapper.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      render();
    }
    window.addEventListener('resize', resize);

    // --- ОТРИСОВКА ---
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-camera.x, -camera.y);

      if (showGrid) drawGridInWorld();

      ctx.drawImage(drawBuffer, 0, 0);

      tokens.forEach(token => {
        if (token.img && token.img.complete) {
          ctx.drawImage(token.img, token.x, token.y, token.width, token.height);
        }
      });

      if (selectedToken && isHost) {
        ctx.save();
        ctx.strokeStyle = '#d49635';
        ctx.lineWidth = 2.5 / camera.zoom;
        ctx.setLineDash([7 / camera.zoom, 4 / camera.zoom]);
        ctx.strokeRect(selectedToken.x, selectedToken.y, selectedToken.width, selectedToken.height);

        ctx.setLineDash([]);
        ctx.fillStyle = '#ffcf68';
        ctx.strokeStyle = '#43290f';
        ctx.lineWidth = 2 / camera.zoom;
        ctx.beginPath();
        const handleX = selectedToken.x + selectedToken.width;
        const handleY = selectedToken.y + selectedToken.height;
        ctx.arc(handleX, handleY, RESIZE_HANDLE_RADIUS / camera.zoom, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
      zoomLevelDisplay.textContent = `${Math.round(camera.zoom * 100)}%`;
    }

    function drawGridInWorld() {
      const startX = Math.floor(camera.x / GRID_SIZE) * GRID_SIZE;
      const endX = camera.x + canvas.width / camera.zoom;
      const startY = Math.floor(camera.y / GRID_SIZE) * GRID_SIZE;
      const endY = camera.y + canvas.height / camera.zoom;

      ctx.strokeStyle = 'rgba(102, 73, 44, 0.32)';
      ctx.lineWidth = 1 / camera.zoom;

      ctx.beginPath();
      for (let x = startX; x <= endX + GRID_SIZE; x += GRID_SIZE) {
        ctx.moveTo(x, startY);
        ctx.lineTo(x, endY + GRID_SIZE);
      }
      for (let y = startY; y <= endY + GRID_SIZE; y += GRID_SIZE) {
        ctx.moveTo(startX, y);
        ctx.lineTo(endX + GRID_SIZE, y);
      }
      ctx.stroke();
    }

    // --- ЗУМ И ПАНОРАМА ---
    function zoomAtPoint(factor, sx, sy) {
      const newZoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * factor));
      if (newZoom === camera.zoom) return;

      const target = screenToWorld(sx, sy);
      camera.zoom = newZoom;
      camera.x = target.x - sx / camera.zoom;
      camera.y = target.y - sy / camera.zoom;
      render();
    }

    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      zoomAtPoint(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    btnZoomIn.addEventListener('click', () => zoomAtPoint(1.2, canvas.width / 2, canvas.height / 2));
    btnZoomOut.addEventListener('click', () => zoomAtPoint(0.83, canvas.width / 2, canvas.height / 2));
    btnZoomReset.addEventListener('click', () => {
      camera.zoom = 1.0;
      camera.x = WORLD_SIZE / 2 - canvas.width / 2;
      camera.y = WORLD_SIZE / 2 - canvas.height / 2;
      render();
    });

    // --- ОБРАБОТКА МЫШИ ---
    function isInResizeHandle(wx, wy, token) {
      if (!token) return false;
      const hx = token.x + token.width;
      const hy = token.y + token.height;
      return Math.hypot(wx - hx, wy - hy) <= (RESIZE_HANDLE_RADIUS + 4) / camera.zoom;
    }

    function findTokenUnderCoord(wx, wy) {
      for (let i = tokens.length - 1; i >= 0; i--) {
        const t = tokens[i];
        if (wx >= t.x && wx <= t.x + t.width && wy >= t.y && wy <= t.y + t.height) {
          return t;
        }
      }
      return null;
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const worldPos = screenToWorld(sx, sy);

      // Панорама стола доступна всем (в том числе зрителям)
      if (e.button === 1 || (e.button === 0 && isSpacePressed)) {
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        canvas.style.cursor = 'grabbing';
        return;
      }

      if (e.button !== 0 || !isHost) return; // Зрители не могут редактировать

      if (currentTool === 'select') {
        if (selectedToken && isInResizeHandle(worldPos.x, worldPos.y, selectedToken)) {
          isResizingToken = true;
          return;
        }

        const clicked = findTokenUnderCoord(worldPos.x, worldPos.y);
        if (clicked) {
          selectedToken = clicked;
          isDraggingToken = true;
          tokenOffsetX = worldPos.x - clicked.x;
          tokenOffsetY = worldPos.y - clicked.y;

          tokens = tokens.filter(t => t !== clicked);
          tokens.push(clicked);
          broadcastTokens();
        } else {
          selectedToken = null;
        }
        render();
      } else {
        isDrawing = true;
        lastWorldPos = worldPos;
        applyStroke(worldPos, worldPos, currentTool, colorPicker.value, sizePicker.value);
        broadcastStroke(worldPos, worldPos, currentTool, colorPicker.value, sizePicker.value);
      }
    });

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const worldPos = screenToWorld(sx, sy);

      if (isPanning) {
        camera.x -= (e.clientX - panStartX) / camera.zoom;
        camera.y -= (e.clientY - panStartY) / camera.zoom;
        panStartX = e.clientX;
        panStartY = e.clientY;
        render();
        return;
      }

      if (!isHost) {
        canvas.style.cursor = isSpacePressed ? 'grab' : 'default';
        return;
      }

      if (currentTool === 'select') {
        if (isResizingToken && selectedToken) {
          selectedToken.width = Math.max(25, worldPos.x - selectedToken.x);
          selectedToken.height = Math.max(25, worldPos.y - selectedToken.y);
          render();
          broadcastTokens();
          return;
        }

        if (isDraggingToken && selectedToken) {
          selectedToken.x = worldPos.x - tokenOffsetX;
          selectedToken.y = worldPos.y - tokenOffsetY;
          render();
          broadcastTokens();
          return;
        }

        if (isSpacePressed) {
          canvas.style.cursor = 'grab';
        } else if (selectedToken && isInResizeHandle(worldPos.x, worldPos.y, selectedToken)) {
          canvas.style.cursor = 'nwse-resize';
        } else if (findTokenUnderCoord(worldPos.x, worldPos.y)) {
          canvas.style.cursor = 'move';
        } else {
          canvas.style.cursor = 'default';
        }
      } else {
        canvas.style.cursor = 'crosshair';
        if (isDrawing) {
          applyStroke(lastWorldPos, worldPos, currentTool, colorPicker.value, sizePicker.value);
          broadcastStroke(lastWorldPos, worldPos, currentTool, colorPicker.value, sizePicker.value);
          lastWorldPos = worldPos;
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      isDraggingToken = false;
      isResizingToken = false;
      isDrawing = false;
      if (isSpacePressed) canvas.style.cursor = 'grab';
    });

    function applyStroke(from, to, tool, color, size) {
      drawCtx.lineWidth = size;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      if (tool === 'brush') {
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = color;
      } else if (tool === 'eraser') {
        drawCtx.globalCompositeOperation = 'destination-out';
      }

      drawCtx.beginPath();
      drawCtx.moveTo(from.x, from.y);
      drawCtx.lineTo(to.x, to.y);
      drawCtx.stroke();
      render();
    }

    // --- ИНСТРУМЕНТЫ И ХОТКЕИ ---
    function setTool(t) {
      if (!isHost) return;
      currentTool = t;
      [btnSelect, btnBrush, btnEraser].forEach(b => b.classList.remove('active'));
      if (t === 'select') btnSelect.classList.add('active');
      if (t === 'brush') btnBrush.classList.add('active');
      if (t === 'eraser') btnEraser.classList.add('active');

      if (t !== 'select') {
        selectedToken = null;
        render();
      }
    }

    btnSelect.addEventListener('click', () => setTool('select'));
    btnBrush.addEventListener('click', () => setTool('brush'));
    btnEraser.addEventListener('click', () => setTool('eraser'));

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isSpacePressed) {
        isSpacePressed = true;
        canvas.style.cursor = 'grab';
      }
      if (!isHost) return;

      if (e.key === 'v' || e.key === 'V' || e.key === 'м' || e.key === 'М') setTool('select');
      if (e.key === 'b' || e.key === 'B' || e.key === 'и' || e.key === 'И') setTool('brush');
      if (e.key === 'e' || e.key === 'E' || e.key === 'у' || e.key === 'У') setTool('eraser');

      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedToken) {
        tokens = tokens.filter(t => t !== selectedToken);
        selectedToken = null;
        render();
        broadcastTokens();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        isSpacePressed = false;
        canvas.style.cursor = 'default';
      }
    });

    btnGrid.addEventListener('click', () => {
      showGrid = !showGrid;
      btnGrid.textContent = showGrid ? '🕸️ Сетка' : '🕸️ Без сетки';
      render();
      if (isHost) broadcast({ type: 'GRID_TOGGLE', showGrid });
    });

    btnClearDrawings.addEventListener('click', () => {
      if (confirm('Стереть все рисунки со свитка? (Изображения останутся)')) {
        drawCtx.clearRect(0, 0, drawBuffer.width, drawBuffer.height);
        render();
        if (isHost) broadcast({ type: 'CLEAR_DRAWINGS' });
      }
    });

    // --- ХРАНИЛИЩЕ ИЗОБРАЖЕНИЙ ---
    fileInput.addEventListener('change', (e) => {
      const files = e.target.files;
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        const reader = new FileReader();
        reader.onload = (event) => addToStorage(event.target.result);
        reader.readAsDataURL(file);
      }
      fileInput.value = '';
    });

    function addToStorage(src) {
      if (!storageImages.includes(src)) storageImages.push(src);

      const item = document.createElement('div');
      item.classList.add('gallery-item');
      item.draggable = true;

      const img = document.createElement('img');
      img.src = src;

      const delBtn = document.createElement('button');
      delBtn.classList.add('del-btn');
      delBtn.innerHTML = '✕';
      delBtn.title = 'Удалить';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        storageImages = storageImages.filter(s => s !== src);
        item.remove();
      });

      item.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', src));
      item.addEventListener('click', () => {
        const center = screenToWorld(canvas.width / 2, canvas.height / 2);
        createImageObject(src, center.x - 60, center.y - 60);
      });

      item.appendChild(img);
      item.appendChild(delBtn);
      gallery.appendChild(item);
    }

    function createImageObject(src, wx, wy, width = 120, height = 120) {
      const img = new Image();
      img.onload = () => {
        const token = { id: 'tok_' + Date.now() + Math.random(), img, src, x: wx, y: wy, width, height };
        tokens.push(token);
        selectedToken = token;
        setTool('select');
        render();
        if (isHost) broadcastTokens();
      };
      img.src = src;
    }

    wrapper.addEventListener('dragover', (e) => { if (isHost) e.preventDefault(); });
    wrapper.addEventListener('drop', (e) => {
      if (!isHost) return;
      e.preventDefault();
      const src = e.dataTransfer.getData('text/plain');
      const rect = canvas.getBoundingClientRect();
      const dropWorld = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);

      if (src) {
        createImageObject(src, dropWorld.x - 60, dropWorld.y - 60);
      } else if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            addToStorage(ev.target.result);
            createImageObject(ev.target.result, dropWorld.x - 60, dropWorld.y - 60);
          };
          reader.readAsDataURL(file);
        }
      }
    });

    // ====================================================
    // СИНХРОНИЗАЦИЯ В РЕАЛЬНОМ ВРЕМЕНИ (PEERJS / WEBRTC)
    // ====================================================

    function broadcast(data) {
      connections.forEach(conn => {
        if (conn.open) conn.send(data);
      });
    }

    function broadcastStroke(from, to, tool, color, size) {
      broadcast({ type: 'STROKE', from, to, tool, color, size });
    }

    function broadcastTokens() {
      const serializableTokens = tokens.map(t => ({
        id: t.id,
        src: t.src || t.img.src,
        x: t.x,
        y: t.y,
        width: t.width,
        height: t.height
      }));
      broadcast({ type: 'TOKENS_UPDATE', tokens: serializableTokens });
    }

    function getFullStateSnapshot() {
      return {
        type: 'INIT_STATE',
        showGrid: showGrid,
        drawingsDataUrl: drawBuffer.toDataURL('image/png'),
        tokens: tokens.map(t => ({
          id: t.id,
          src: t.src || t.img.src,
          x: t.x,
          y: t.y,
          width: t.width,
          height: t.height
        }))
      };
    }

    // Режим Хоста (Мастера)
    function initHostMode() {
      isHost = true;
      document.body.classList.remove('spectator-mode');
      netStatus.style.display = 'inline-flex';
      netStatus.innerHTML = `👑 Мастер: <b>Одиночная игра</b>`;

      btnShareLink.addEventListener('click', () => {
        if (!peer) {
          btnShareLink.textContent = '⏳ Создание комнаты...';
          const hostId = 'dnd-room-' + Math.random().toString(36).substr(2, 9);
          peer = new Peer(hostId);

          peer.on('open', (id) => {
            const shareUrl = window.location.origin + window.location.pathname + '#' + id;
            navigator.clipboard.writeText(shareUrl).then(() => {
              alert('🔗 Ссылка на стол скопирована в буфер обмена!\nОтправьте её игрокам: они подключатся в режиме зрителя.');
            }).catch(() => {
              prompt('Скопируйте эту ссылку для игроков:', shareUrl);
            });

            btnShareLink.textContent = '🔗 Ссылка скопирована';
            netStatus.innerHTML = `👑 Мастер (Зрителей: 0)`;
          });

          peer.on('connection', (conn) => {
            connections.push(conn);
            conn.on('open', () => {
              netStatus.innerHTML = `👑 Мастер (Зрителей: ${connections.filter(c => c.open).length})`;
              // Отправляем новому зрителю полный снимок стола
              conn.send(getFullStateSnapshot());
            });

            conn.on('close', () => {
              connections = connections.filter(c => c !== conn);
              netStatus.innerHTML = `👑 Мастер (Зрителей: ${connections.length})`;
            });
          });

          peer.on('error', (err) => {
            console.error('Peer error:', err);
            alert('Ошибка подключения к серверу синхронизации. Проверьте интернет.');
            btnShareLink.textContent = '🔗 Поделиться столом';
          });
        } else {
          const shareUrl = window.location.origin + window.location.pathname + '#' + peer.id;
          navigator.clipboard.writeText(shareUrl).then(() => {
            alert('🔗 Ссылка повторно скопирована в буфер обмена!');
          });
        }
      });
    }

    // Режим Зрителя (Игрока)
    function initSpectatorMode(hostId) {
      isHost = false;
      document.body.classList.add('spectator-mode');
      btnShareLink.style.display = 'none';
      netStatus.style.display = 'inline-flex';
      netStatus.innerHTML = `🔄 Подключение к Мастеру...`;
      roleHint.innerHTML = `👁️ <b>Режим зрителя:</b> редактирует Мастер`;

      peer = new Peer();

      peer.on('open', () => {
        hostConnection = peer.connect(hostId);

        hostConnection.on('open', () => {
          netStatus.innerHTML = `👁️ <b>Подключен к столу</b>`;
        });

        hostConnection.on('data', (data) => {
          handleIncomingData(data);
        });

        hostConnection.on('close', () => {
          netStatus.innerHTML = `❌ Мастер отключился`;
          alert('Мастер завершил сессию стола.');
        });
      });

      peer.on('error', (err) => {
        console.error(err);
        netStatus.innerHTML = `❌ Ошибка подключения`;
        alert('Не удалось подключиться к столу. Возможно, комната уже закрыта или неверная ссылка.');
      });
    }

    // Обработка данных от хоста зрителем
    function handleIncomingData(data) {
      if (data.type === 'INIT_STATE') {
        showGrid = data.showGrid;
        btnGrid.textContent = showGrid ? '🕸️ Сетка' : '🕸️ Без сетки';

        drawCtx.clearRect(0, 0, drawBuffer.width, drawBuffer.height);
        if (data.drawingsDataUrl) {
          const dImg = new Image();
          dImg.onload = () => {
            drawCtx.drawImage(dImg, 0, 0);
            render();
          };
          dImg.src = data.drawingsDataUrl;
        }

        tokens = [];
        if (Array.isArray(data.tokens)) {
          data.tokens.forEach(tok => {
            const img = new Image();
            img.onload = () => {
              tokens.push({ id: tok.id, img, src: tok.src, x: tok.x, y: tok.y, width: tok.width, height: tok.height });
              render();
            };
            img.src = tok.src;
          });
        }
      } else if (data.type === 'STROKE') {
        applyStroke(data.from, data.to, data.tool, data.color, data.size);
      } else if (data.type === 'TOKENS_UPDATE') {
        const newTokens = [];
        let pending = data.tokens.length;
        if (pending === 0) {
          tokens = [];
          render();
          return;
        }

        data.tokens.forEach(tok => {
          const existing = tokens.find(t => t.id === tok.id && t.src === tok.src);
          if (existing) {
            existing.x = tok.x;
            existing.y = tok.y;
            existing.width = tok.width;
            existing.height = tok.height;
            newTokens.push(existing);
            pending--;
            if (pending === 0) {
              tokens = newTokens;
              render();
            }
          } else {
            const img = new Image();
            img.onload = () => {
              newTokens.push({ id: tok.id, img, src: tok.src, x: tok.x, y: tok.y, width: tok.width, height: tok.height });
              pending--;
              if (pending === 0) {
                tokens = newTokens;
                render();
              }
            };
            img.src = tok.src;
          }
        });
      } else if (data.type === 'GRID_TOGGLE') {
        showGrid = data.showGrid;
        btnGrid.textContent = showGrid ? '🕸️ Сетка' : '🕸️ Без сетки';
        render();
      } else if (data.type === 'CLEAR_DRAWINGS') {
        drawCtx.clearRect(0, 0, drawBuffer.width, drawBuffer.height);
        render();
      }
    }

    // Сохранение и загрузка файлов
    btnSaveProject.addEventListener('click', () => {
      const session = {
        version: "1.0",
        camera: { x: camera.x, y: camera.y, zoom: camera.zoom },
        showGrid: showGrid,
        storageImages: storageImages,
        tokens: tokens.map(t => ({ id: t.id, src: t.src || t.img.src, x: t.x, y: t.y, width: t.width, height: t.height })),
        drawingsDataUrl: drawBuffer.toDataURL('image/png')
      };

      const blob = new Blob([JSON.stringify(session)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Свиток_${Date.now()}.dnd`;
      a.click();
      URL.revokeObjectURL(url);
    });

    btnLoadTrigger.addEventListener('click', () => saveFileInput.click());
    saveFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          gallery.innerHTML = '';
          storageImages = [];
          if (Array.isArray(data.storageImages)) data.storageImages.forEach(src => addToStorage(src));

          handleIncomingData({
            type: 'INIT_STATE',
            showGrid: data.showGrid,
            drawingsDataUrl: data.drawingsDataUrl,
            tokens: data.tokens
          });

          if (isHost) broadcast(getFullStateSnapshot());
          alert('Свиток загружен!');
        } catch (err) {
          alert('Ошибка при чтении файла сохранения!');
        }
      };
      reader.readAsText(file);
      saveFileInput.value = '';
    });

    // --- ОПРЕДЕЛЕНИЕ РОЛИ ПРИ СТАРТЕ ---
    resize();
    camera.x = WORLD_SIZE / 2 - canvas.width / 2;
    camera.y = WORLD_SIZE / 2 - canvas.height / 2;
    render();

    const hash = window.location.hash.substring(1);
    if (hash && hash.startsWith('dnd-room-')) {
      initSpectatorMode(hash);
    } else {
      initHostMode();
    }
  </script>
</body>
</html>
