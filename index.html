<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Крокодилы и Канализации | D&D Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Marcellus&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-border: #b18544;
      --gold-text: #f0c97d;
      --metal-bg: linear-gradient(180deg, #46372b 0%, #2b2018 50%, #17100b 100%);
      --metal-active: linear-gradient(180deg, #744d21 0%, #3e2610 100%);
      --parchment: #c8b594;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0907;
      color: #dfcdb7;
      font-family: 'Marcellus', serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ВЕРХНЯЯ КОВАНАЯ ПАНЕЛЬ */
    header {
      height: 52px;
      background: linear-gradient(180deg, #2b2118 0%, #18120d 70%, #0c0806 100%);
      border-bottom: 2px solid #5a422d;
      box-shadow: 0 4px 15px rgba(0,0,0,0.95);
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* КОВАНЫЙ ЩИТ-ЛОГОТИП */
    .logo-shield {
      width: 36px;
      height: 44px;
      position: relative;
      background: radial-gradient(circle at 50% 35%, #5a2e16, #201108);
      clip-path: polygon(0% 0%, 100% 0%, 100% 70%, 50% 100%, 0% 70%);
      border: 2px solid #b8863f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(184, 134, 63, 0.4), inset 0 0 6px #000;
      filter: drop-shadow(0 2px 4px #000);
      flex-shrink: 0;
    }

    .shield-emblem {
      position: relative;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shield-emblem svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 1px 2px #000);
    }

    .logo-shield::before, .logo-shield::after {
      content: '';
      position: absolute;
      width: 3px;
      height: 3px;
      background: #e6b76a;
      border-radius: 50%;
      box-shadow: 0 0 2px #000;
    }
    .logo-shield::before { top: 3px; left: 4px; }
    .logo-shield::after { top: 3px; right: 4px; }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: var(--gold-text);
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(240, 201, 125, 0.4), 2px 2px 3px #000;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      background: var(--metal-bg);
      color: #e5d7c4;
      border: 1px solid #5d4633;
      padding: 4px 11px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.76rem;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 2px 4px rgba(0,0,0,0.7);
    }

    .btn:hover {
      border-color: #d1994e;
      color: #ffd88a;
      box-shadow: 0 0 8px rgba(220, 150, 40, 0.5);
    }

    .btn.active {
      background: var(--metal-active);
      border-color: #f1b75e;
      color: #ffe6a3;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8), 0 0 10px rgba(241, 183, 94, 0.5);
    }

    .zoom-box {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(0,0,0,0.55);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #4a3625;
      font-size: 0.74rem;
      color: var(--gold-text);
      font-family: 'Cinzel', serif;
    }

    input[type="color"] {
      border: 1px solid #5d4633;
      background: none;
      width: 24px;
      height: 24px;
      border-radius: 3px;
      cursor: pointer;
      padding: 0;
    }

    .range-box {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      color: var(--gold-text);
    }

    /* ОСНОВНАЯ СЦЕНА ПОДЗЕМЕЛЬЯ */
    .dungeon-scene {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      padding: 10px 14px 12px 14px;
      gap: 12px;
      background:
        radial-gradient(circle at 17% 20%, rgba(255, 140, 0, 0.35) 0%, rgba(255, 100, 0, 0.1) 22%, transparent 35%),
        radial-gradient(circle at 94% 22%, rgba(255, 140, 0, 0.35) 0%, rgba(255, 100, 0, 0.1) 22%, transparent 35%),
        radial-gradient(circle at 50% 50%, #2a221b 0%, #120e0b 60%, #080605 100%);
      background-size: cover;
    }

    /* ЛЕВАЯ КОЛОНКА - ИЗОБРАЖЕНИЯ */
    .sidebar-scroll {
      width: 240px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #140f0c;
      border: 3px solid #473626;
      border-radius: 6px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 6px 20px rgba(0,0,0,0.8);
      position: relative;
      z-index: 10;
    }

    .scroll-head {
      padding: 7px;
      background: linear-gradient(180deg, #2b1f16, #140e0a);
      border-bottom: 2px solid #473626;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: var(--gold-text);
      letter-spacing: 1px;
    }

    .upload-btn-box {
      padding: 6px 8px;
      border-bottom: 1px solid #332419;
      background: #0e0a07;
    }

    .upload-label {
      display: block;
      border: 1px dashed #7a5837;
      padding: 5px;
      border-radius: 4px;
      cursor: pointer;
      background: rgba(43, 30, 19, 0.5);
      font-size: 0.74rem;
      text-align: center;
      color: #e5d7c4;
      transition: 0.2s;
    }

    .upload-label:hover {
      border-color: var(--gold-border);
      color: var(--gold-text);
    }

    #file-input, #save-file-input { display: none; }

    .inventory-parchment {
      flex: 1;
      margin: 8px;
      background: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 80%),
        linear-gradient(180deg, #c7b38d 0%, #b89f75 50%, #a28357 100%);
      border: 2px solid #5c432a;
      border-radius: 4px;
      box-shadow: inset 0 0 15px rgba(60, 40, 15, 0.65);
      overflow-y: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      align-content: start;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1;
      border: 2px solid #573e27;
      border-radius: 4px;
      overflow: hidden;
      cursor: grab;
      background: #0f0b08;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
      transition: transform 0.15s, border-color 0.15s;
    }

    .gallery-item:hover {
      border-color: #ffd88a;
      transform: scale(1.05);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .gallery-item .del-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(140, 0, 0, 0.85);
      color: white;
      border: none;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 9px;
      cursor: pointer;
      display: none;
    }

    .gallery-item:hover .del-btn { display: block; }

    /* ДЕКОРАТИВНЫЕ СИЛУЭТЫ СТРАЖЕЙ */
    .lizard-guard {
      position: absolute;
      bottom: 0;
      width: 280px;
      height: 85%;
      pointer-events: none;
      z-index: 5;
      background-repeat: no-repeat;
      background-position: bottom center;
      background-size: contain;
      filter: drop-shadow(0 0 15px rgba(0,0,0,0.85));
    }

    .lizard-left {
      left: 235px;
      background-image: radial-gradient(circle at 65% 25%, rgba(255, 140, 0, 0.3) 0%, transparent 40%);
    }

    .lizard-right {
      right: 0;
      background-image: radial-gradient(circle at 40% 25%, rgba(60, 255, 100, 0.3) 0%, transparent 40%);
    }

    /* ЦЕНТРАЛЬНЫЙ СТОЛ (ПОЛНОРАЗМЕРНЫЙ СВИТОК) */
    .scroll-table-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 8;
      border: 3px solid #4a3625;
      border-radius: 6px;
      background: #110d0a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    .scroll-roll-top {
      height: 20px;
      background: linear-gradient(180deg, #3c2919 0%, #7d5e3c 45%, #d1b48b 55%, #6a4c2e 85%, #2a1b10 100%);
      border-bottom: 2px solid #23160c;
      box-shadow: 0 3px 8px rgba(0,0,0,0.7);
    }

    .canvas-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12), transparent 75%),
        linear-gradient(180deg, #d3c19f 0%, #c0ab86 50%, #ad946f 100%);
      box-shadow: inset 0 0 70px rgba(60, 40, 15, 0.6);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .instructions-card {
      position: absolute;
      bottom: 16px;
      right: 20px;
      background: linear-gradient(180deg, rgba(28, 20, 14, 0.95), rgba(14, 10, 7, 0.95));
      border: 2px solid #6b4d30;
      border-radius: 5px;
      padding: 7px 12px;
      font-size: 0.72rem;
      color: #dfcdb7;
      line-height: 1.4;
      box-shadow: 0 4px 15px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 20;
    }

    .instructions-card b {
      color: var(--gold-text);
    }
  </style>
</head>
<body>

  <!-- Верхняя панель инструментов -->
  <header>
    <div class="title-box">
      <div class="logo-shield" title="Крокодилы и Канализации">
        <div class="shield-emblem">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 28,32 C 18,12 30,-2 40,2 C 34,10 32,22 36,36 Z" fill="url(#goldGradient)" />
            <path d="M 72,32 C 82,12 70,-2 60,2 C 66,10 68,22 64,36 Z" fill="url(#goldGradient)" />
            <path d="M 32,32 C 32,20 68,20 68,32 C 68,46 64,68 56,84 C 54,88 46,88 44,84 C 36,68 32,46 32,32 Z" fill="url(#goldGradient)" stroke="#4a3014" stroke-width="2"/>
            <circle cx="42" cy="46" r="6" fill="#301808" />
            <circle cx="58" cy="46" r="6" fill="#301808" />
            <circle cx="42" cy="46" r="4" fill="#ffd700" />
            <circle cx="58" cy="46" r="4" fill="#ffd700" />
            <circle cx="42" cy="46" r="2" fill="#000" />
            <circle cx="58" cy="46" r="2" fill="#000" />
            <polygon points="46,84 48,92 50,84" fill="#fff5d0" />
            <polygon points="50,84 52,92 54,84" fill="#fff5d0" />
            <defs>
              <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fae29c" />
                <stop offset="50%" stop-color="#c99738" />
                <stop offset="100%" stop-color="#694314" />
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>
      <h1>Крокодилы и Канализации</h1>
    </div>

    <div class="toolbar">
      <button class="btn active" id="tool-select" title="Горячая клавиша: V">✋ Перемещение</button>
      <button class="btn" id="tool-brush" title="Горячая клавиша: B">🖌️ Кисть</button>
      <button class="btn" id="tool-eraser" title="Горячая клавиша: E">🧹 Ластик</button>

      <div class="range-box">
        <label for="brush-color">Цвет:</label>
        <input type="color" id="brush-color" value="#8b1c1c">
      </div>

      <div class="range-box">
        <label for="brush-size">Размер:</label>
        <input type="range" id="brush-size" min="2" max="60" value="6">
      </div>

      <div class="zoom-box">
        <button class="btn" id="btn-zoom-out" style="padding:2px 6px;">-</button>
        <span id="zoom-level">100%</span>
        <button class="btn" id="btn-zoom-in" style="padding:2px 6px;">+</button>
        <button class="btn" id="btn-zoom-reset" style="padding:2px 6px;">1:1</button>
      </div>

      <button class="btn" id="btn-toggle-grid">🕸️ Сетка</button>
      <button class="btn" id="btn-clear-drawings" style="color: #ff9d9d;">Очистить рисунки</button>

      <button class="btn" id="btn-save-project" title="Сохранить в файл">💾 Сохранить</button>
      <button class="btn" id="btn-load-trigger" title="Загрузить из файла">📂 Загрузить</button>
      <input type="file" id="save-file-input" accept=".dnd,.json">
    </div>
  </header>

  <!-- Сцена -->
  <main class="dungeon-scene">
    <aside class="sidebar-scroll">
      <div class="scroll-head">Изображения</div>
      <div class="upload-btn-box">
        <label class="upload-label" for="file-input">➕ Загрузить изображение</label>
        <input type="file" id="file-input" accept="image/*" multiple>
      </div>
      <div class="inventory-parchment" id="storage-gallery"></div>
    </aside>

    <div class="lizard-guard lizard-left"></div>
    <div class="lizard-guard lizard-right"></div>

    <section class="scroll-table-container">
      <div class="scroll-roll-top"></div>
      <div class="canvas-viewport" id="canvas-wrapper">
        <canvas id="viewport-canvas"></canvas>
      </div>
    </section>

    <div class="instructions-card">
      • <b>Зум:</b> Колёсико мыши<br>
      • <b>Панорама:</b> Колёсико или <b>Пробел + ЛКМ</b><br>
      • <b>Изображения:</b> Перетаскивание инструментом «✋»
    </div>
  </main>

  <script>
    const wrapper = document.getElementById('canvas-wrapper');
    const canvas = document.getElementById('viewport-canvas');
    const ctx = canvas.getContext('2d');

    const fileInput = document.getElementById('file-input');
    const saveFileInput = document.getElementById('save-file-input');
    const gallery = document.getElementById('storage-gallery');
    const btnSelect = document.getElementById('tool-select');
    const btnBrush = document.getElementById('tool-brush');
    const btnEraser = document.getElementById('tool-eraser');
    const colorPicker = document.getElementById('brush-color');
    const sizePicker = document.getElementById('brush-size');
    const btnGrid = document.getElementById('btn-toggle-grid');
    const btnClearDrawings = document.getElementById('btn-clear-drawings');
    const btnSaveProject = document.getElementById('btn-save-project');
    const btnLoadTrigger = document.getElementById('btn-load-trigger');

    const zoomLevelDisplay = document.getElementById('zoom-level');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnZoomReset = document.getElementById('btn-zoom-reset');

    let camera = { x: 0, y: 0, zoom: 1.0, minZoom: 0.2, maxZoom: 5.0 };
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let isSpacePressed = false;

    let currentTool = 'select';
    let isDrawing = false;
    let lastWorldPos = { x: 0, y: 0 };
    let renderRequested = false;

    let showGrid = true;
    const GRID_SIZE = 60;

    let strokes = [];
    const imageAssetCache = new Map();
    let storageImages = [];
    let tokens = [];
    let selectedToken = null;
    let isDraggingToken = false;
    let isResizingToken = false;
    let tokenOffsetX = 0;
    let tokenOffsetY = 0;
    const RESIZE_HANDLE_RADIUS = 9;

    function screenToWorld(sx, sy) {
      return {
        x: camera.x + sx / camera.zoom,
        y: camera.y + sy / camera.zoom
      };
    }

    function resize() {
      const rect = wrapper.getBoundingClientRect();
      if (canvas.width !== rect.width || canvas.height !== rect.height) {
        canvas.width = rect.width;
        canvas.height = rect.height;
        requestRender();
      }
    }
    window.addEventListener('resize', resize);

    function requestRender() {
      if (!renderRequested) {
        renderRequested = true;
        requestAnimationFrame(renderLoop);
      }
    }

    function renderLoop() {
      renderRequested = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-camera.x, -camera.y);

      if (showGrid) drawGridInWorld();

      // Штрихи кисти
      for (let i = 0; i < strokes.length; i++) {
        const s = strokes[i];
        ctx.save();
        ctx.lineWidth = s.size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (s.tool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = s.color;
        }
        ctx.beginPath();
        ctx.moveTo(s.from[0], s.from[1]);
        ctx.lineTo(s.to[0], s.to[1]);
        ctx.stroke();
        ctx.restore();
      }

      // Токены
      for (let i = 0; i < tokens.length; i++) {
        const t = tokens[i];
        const img = imageAssetCache.get(t.assetId);
        if (img && img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, t.x, t.y, t.width, t.height);
        }
      }

      // Выделение токена
      if (selectedToken) {
        ctx.save();
        ctx.strokeStyle = '#d49635';
        ctx.lineWidth = 2.5 / camera.zoom;
        ctx.setLineDash([7 / camera.zoom, 4 / camera.zoom]);
        ctx.strokeRect(selectedToken.x, selectedToken.y, selectedToken.width, selectedToken.height);

        ctx.setLineDash([]);
        ctx.fillStyle = '#ffcf68';
        ctx.strokeStyle = '#43290f';
        ctx.lineWidth = 2 / camera.zoom;
        ctx.beginPath();
        const handleX = selectedToken.x + selectedToken.width;
        const handleY = selectedToken.y + selectedToken.height;
        ctx.arc(handleX, handleY, RESIZE_HANDLE_RADIUS / camera.zoom, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
      zoomLevelDisplay.textContent = `${Math.round(camera.zoom * 100)}%`;
    }

    function drawGridInWorld() {
      const startX = Math.floor(camera.x / GRID_SIZE) * GRID_SIZE;
      const endX = camera.x + canvas.width / camera.zoom;
      const startY = Math.floor(camera.y / GRID_SIZE) * GRID_SIZE;
      const endY = camera.y + canvas.height / camera.zoom;

      ctx.strokeStyle = 'rgba(102, 73, 44, 0.32)';
      ctx.lineWidth = 1 / camera.zoom;

      ctx.beginPath();
      for (let x = startX; x <= endX + GRID_SIZE; x += GRID_SIZE) {
        ctx.moveTo(x, startY);
        ctx.lineTo(x, endY + GRID_SIZE);
      }
      for (let y = startY; y <= endY + GRID_SIZE; y += GRID_SIZE) {
        ctx.moveTo(startX, y);
        ctx.lineTo(endX + GRID_SIZE, y);
      }
      ctx.stroke();
    }

    function zoomAtPoint(factor, sx, sy) {
      const newZoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * factor));
      if (newZoom === camera.zoom) return;

      const target = screenToWorld(sx, sy);
      camera.zoom = newZoom;
      camera.x = target.x - sx / camera.zoom;
      camera.y = target.y - sy / camera.zoom;
      requestRender();
    }

    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      zoomAtPoint(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    btnZoomIn.addEventListener('click', () => zoomAtPoint(1.2, canvas.width / 2, canvas.height / 2));
    btnZoomOut.addEventListener('click', () => zoomAtPoint(0.83, canvas.width / 2, canvas.height / 2));
    btnZoomReset.addEventListener('click', () => {
      camera.zoom = 1.0;
      camera.x = 0;
      camera.y = 0;
      requestRender();
    });

    function isInResizeHandle(wx, wy, token) {
      if (!token) return false;
      const hx = token.x + token.width;
      const hy = token.y + token.height;
      return Math.hypot(wx - hx, wy - hy) <= (RESIZE_HANDLE_RADIUS + 4) / camera.zoom;
    }

    function findTokenUnderCoord(wx, wy) {
      for (let i = tokens.length - 1; i >= 0; i--) {
        const t = tokens[i];
        if (wx >= t.x && wx <= t.x + t.width && wy >= t.y && wy <= t.y + t.height) {
          return t;
        }
      }
      return null;
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const worldPos = screenToWorld(sx, sy);

      if (e.button === 1 || (e.button === 0 && isSpacePressed)) {
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        canvas.style.cursor = 'grabbing';
        return;
      }

      if (e.button !== 0) return;

      if (currentTool === 'select') {
        if (selectedToken && isInResizeHandle(worldPos.x, worldPos.y, selectedToken)) {
          isResizingToken = true;
          return;
        }

        const clicked = findTokenUnderCoord(worldPos.x, worldPos.y);
        if (clicked) {
          selectedToken = clicked;
          isDraggingToken = true;
          tokenOffsetX = worldPos.x - clicked.x;
          tokenOffsetY = worldPos.y - clicked.y;

          tokens = tokens.filter(t => t !== clicked);
          tokens.push(clicked);
        } else {
          selectedToken = null;
        }
        requestRender();
      } else {
        isDrawing = true;
        lastWorldPos = worldPos;
        addStroke(worldPos, worldPos, currentTool, colorPicker.value, parseInt(sizePicker.value, 10));
      }
    });

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const worldPos = screenToWorld(sx, sy);

      if (isPanning) {
        camera.x -= (e.clientX - panStartX) / camera.zoom;
        camera.y -= (e.clientY - panStartY) / camera.zoom;
        panStartX = e.clientX;
        panStartY = e.clientY;
        requestRender();
        return;
      }

      if (currentTool === 'select') {
        if (isResizingToken && selectedToken) {
          selectedToken.width = Math.max(25, Math.round(worldPos.x - selectedToken.x));
          selectedToken.height = Math.max(25, Math.round(worldPos.y - selectedToken.y));
          requestRender();
          return;
        }

        if (isDraggingToken && selectedToken) {
          selectedToken.x = Math.round(worldPos.x - tokenOffsetX);
          selectedToken.y = Math.round(worldPos.y - tokenOffsetY);
          requestRender();
          return;
        }

        if (isSpacePressed) {
          canvas.style.cursor = 'grab';
        } else if (selectedToken && isInResizeHandle(worldPos.x, worldPos.y, selectedToken)) {
          canvas.style.cursor = 'nwse-resize';
        } else if (findTokenUnderCoord(worldPos.x, worldPos.y)) {
          canvas.style.cursor = 'move';
        } else {
          canvas.style.cursor = 'default';
        }
      } else {
        canvas.style.cursor = 'crosshair';
        if (isDrawing) {
          addStroke(lastWorldPos, worldPos, currentTool, colorPicker.value, parseInt(sizePicker.value, 10));
          lastWorldPos = worldPos;
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      isDraggingToken = false;
      isResizingToken = false;
      isDrawing = false;
      if (isSpacePressed) canvas.style.cursor = 'grab';
    });

    function addStroke(from, to, tool, color, size) {
      strokes.push({
        from: [Math.round(from.x), Math.round(from.y)],
        to: [Math.round(to.x), Math.round(to.y)],
        tool,
        color,
        size
      });
      requestRender();
    }

    function setTool(t) {
      currentTool = t;
      [btnSelect, btnBrush, btnEraser].forEach(b => b.classList.remove('active'));
      if (t === 'select') btnSelect.classList.add('active');
      if (t === 'brush') btnBrush.classList.add('active');
      if (t === 'eraser') btnEraser.classList.add('active');

      if (t !== 'select') {
        selectedToken = null;
        requestRender();
      }
    }

    btnSelect.addEventListener('click', () => setTool('select'));
    btnBrush.addEventListener('click', () => setTool('brush'));
    btnEraser.addEventListener('click', () => setTool('eraser'));

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isSpacePressed) {
        isSpacePressed = true;
        canvas.style.cursor = 'grab';
      }

      if (e.key === 'v' || e.key === 'V' || e.key === 'м' || e.key === 'М') setTool('select');
      if (e.key === 'b' || e.key === 'B' || e.key === 'и' || e.key === 'И') setTool('brush');
      if (e.key === 'e' || e.key === 'E' || e.key === 'у' || e.key === 'У') setTool('eraser');

      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedToken) {
        tokens = tokens.filter(t => t !== selectedToken);
        selectedToken = null;
        requestRender();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        isSpacePressed = false;
        canvas.style.cursor = 'default';
      }
    });

    btnGrid.addEventListener('click', () => {
      showGrid = !showGrid;
      btnGrid.textContent = showGrid ? '🕸️ Сетка' : '🕸️ Без сетки';
      requestRender();
    });

    btnClearDrawings.addEventListener('click', () => {
      if (confirm('Стереть все рисунки со свитка? (Изображения останутся)')) {
        strokes = [];
        requestRender();
      }
    });

    function registerImageAsset(src) {
      let hash = 0;
      for (let i = 0; i < src.length; i++) {
        hash = ((hash << 5) - hash) + src.charCodeAt(i);
        hash |= 0;
      }
      const assetId = 'img_' + Math.abs(hash).toString(36);

      if (!imageAssetCache.has(assetId)) {
        const img = new Image();
        img.onload = () => requestRender();
        img.src = src;
        imageAssetCache.set(assetId, img);
      }
      return assetId;
    }

    fileInput.addEventListener('change', (e) => {
      const files = e.target.files;
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        const reader = new FileReader();
        reader.onload = (event) => {
          const src = event.target.result;
          const assetId = registerImageAsset(src);
          addToStorage(assetId, src);
        };
        reader.readAsDataURL(file);
      }
      fileInput.value = '';
    });

    function addToStorage(assetId, src) {
      if (!storageImages.some(s => s.assetId === assetId)) {
        storageImages.push({ assetId, src });
      }

      const item = document.createElement('div');
      item.classList.add('gallery-item');
      item.draggable = true;

      const img = document.createElement('img');
      img.src = src;

      const delBtn = document.createElement('button');
      delBtn.classList.add('del-btn');
      delBtn.innerHTML = '✕';
      delBtn.title = 'Удалить';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        storageImages = storageImages.filter(s => s.assetId !== assetId);
        item.remove();
      });

      item.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', assetId));
      item.addEventListener('click', () => {
        const center = screenToWorld(canvas.width / 2, canvas.height / 2);
        createImageObject(assetId, center.x - 60, center.y - 60);
      });

      item.appendChild(img);
      item.appendChild(delBtn);
      gallery.appendChild(item);
    }

    function createImageObject(assetId, wx, wy, width = 120, height = 120) {
      const token = {
        id: 't_' + Math.random().toString(36).substr(2, 9),
        assetId: assetId,
        x: Math.round(wx),
        y: Math.round(wy),
        width: Math.round(width),
        height: Math.round(height)
      };
      tokens.push(token);
      selectedToken = token;
      setTool('select');
      requestRender();
    }

    wrapper.addEventListener('dragover', (e) => { e.preventDefault(); });
    wrapper.addEventListener('drop', (e) => {
      e.preventDefault();
      const raw = e.dataTransfer.getData('text/plain');
      const rect = canvas.getBoundingClientRect();
      const dropWorld = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);

      if (raw && imageAssetCache.has(raw)) {
        createImageObject(raw, dropWorld.x - 60, dropWorld.y - 60);
      } else if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const src = ev.target.result;
            const assetId = registerImageAsset(src);
            addToStorage(assetId, src);
            createImageObject(assetId, dropWorld.x - 60, dropWorld.y - 60);
          };
          reader.readAsDataURL(file);
        }
      }
    });

    // Сохранение и загрузка .dnd
    btnSaveProject.addEventListener('click', () => {
      const assetsList = [];
      imageAssetCache.forEach((img, assetId) => {
        assetsList.push({ assetId, src: img.src });
      });

      const session = {
        version: "7.0",
        camera: { x: camera.x, y: camera.y, zoom: camera.zoom },
        showGrid: showGrid,
        storageImages: storageImages,
        tokens: tokens,
        strokes: strokes,
        assets: assetsList
      };

      const blob = new Blob([JSON.stringify(session)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Свиток_Партии_${Date.now()}.dnd`;
      a.click();
      URL.revokeObjectURL(url);
    });

    btnLoadTrigger.addEventListener('click', () => saveFileInput.click());
    saveFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          gallery.innerHTML = '';
          storageImages = [];

          if (Array.isArray(data.assets)) {
            data.assets.forEach(a => registerImageAsset(a.src));
          }

          if (Array.isArray(data.storageImages)) {
            data.storageImages.forEach(s => addToStorage(s.assetId, s.src));
          }

          strokes = data.strokes || [];
          tokens = data.tokens || [];
          showGrid = data.showGrid ?? true;

          requestRender();
          alert('Свиток успешно загружен!');
        } catch (err) {
          alert('Ошибка чтения файла сохранения!');
        }
      };
      reader.readAsText(file);
      saveFileInput.value = '';
    });

    resize();
    requestRender();
  </script>
</body>
</html>
